services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_container
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=contatos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend-api:
    build:
      context: ./backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - postgres-db

  frontend-app:
    build:
      context: ./frontend
    ports:
      - "5500:80"
    depends_on:
      - backend-api

volumes:
  postgres_data: